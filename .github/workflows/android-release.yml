name: Android APK Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  NODE_VERSION: 22.x

permissions:
  contents: write

jobs:
  validate:
    name: Validate mobile app
    uses: ./.github/workflows/mobile-ci.yml
    permissions:
      contents: read

  build-android-release:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Normalize APK name
        run: cp android/app/build/outputs/apk/release/app-release.apk "probaho-browser-mobile-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Probaho Browser Mobile ${{ github.ref_name }}
          generate_release_notes: true
          files: probaho-browser-mobile-${{ github.ref_name }}.apk
