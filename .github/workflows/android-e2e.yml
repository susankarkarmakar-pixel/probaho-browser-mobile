name: Android E2E

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: 22.x

concurrency:
  group: android-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detox-android:
    name: Detox Android E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build debug and instrumentation APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleAndroidTest --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Detox on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          avd-name: detox-emulator
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: npx detox test -c android.emu.debug --headless --cleanup --record-logs all

      - name: Upload Detox artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-detox-artifacts
          path: |
            artifacts
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: ignore
